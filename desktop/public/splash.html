<meta charset="utf-8" />
<title>Dermaga</title>

<style>
  /* The app's own faces, copied into public/ so this document can reach them:
     it is loaded before the bundle exists and shares nothing with it. Without
     these the splash was set in the system font and the window it handed over
     to was set in Plex -- the type changed shape in front of you, on the one
     screen whose whole job is to look like the app arriving. */
  @font-face {
    font-family: "IBM Plex Sans Variable";
    font-style: normal;
    font-weight: 100 700;
    font-display: block;
    src: url("./ibm-plex-sans-latin-wght-normal.woff2") format("woff2-variations");
  }

  @font-face {
    font-family: "IBM Plex Mono";
    font-style: normal;
    font-weight: 400;
    font-display: block;
    src: url("./ibm-plex-mono-latin-400-normal.woff2") format("woff2");
  }

  /* The chrome palette, verbatim from tailwind.config.js. It was a set of
     near-blacks invented for this file alone, and they were cooler than the
     app's -- so the splash faded into a window a shade warmer than itself.

     One size for every state -- steps, kernel setup, fatal error. A window
     that resizes as its content changes shivers, and a splash is on screen
     for seconds: it should be still. */
  :root {
    --brand: #c21322;
    --brand-lit: #e4606b;
    --ink: #171416;
    --panel: #221d1f;
    --line: #332c2e;
    --text: #f2efee;
    --muted: #cfc9c6;
    --faint: #6f6764;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    height: 100%;
    background: transparent;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }

  body {
    font: 13px/19px "IBM Plex Sans Variable", -apple-system, BlinkMacSystemFont, system-ui,
      sans-serif;
    color: var(--text);
    -webkit-app-region: drag;
  }

  .frame {
    position: relative;
    display: grid;
    grid-template-rows: 1fr auto;
    height: 100vh;
    overflow: hidden;
    border-radius: 16px;
    background: radial-gradient(120% 90% at 8% 0%, #2a1016 0%, var(--ink) 46%, #0f0d0e 100%);
    box-shadow: 0 24px 70px rgb(0 0 0 / 0.45);
  }

  /* The brand as a wash of colour rather than a block: the logo carries it,
     this only warms the corner it sits in. */
  .frame::before {
    content: "";
    position: absolute;
    inset: -30% 45% 40% -20%;
    background: radial-gradient(closest-side, rgba(194, 19, 34, 0.5), transparent 70%);
    filter: blur(30px);
    pointer-events: none;
  }

  .stage {
    position: relative;
    display: flex;
    gap: 26px;
    align-items: center;
    padding: 40px 44px 0;
  }

  .stage img {
    width: 104px;
    height: 104px;
    flex-shrink: 0;
    filter: drop-shadow(0 10px 24px rgb(0 0 0 / 0.5));
  }

  h1 {
    margin: 0;
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -0.5px;
    line-height: 1.05;
  }

  .tagline {
    margin: 8px 0 0;
    font-size: 13.5px;
    line-height: 20px;
    color: var(--muted);
  }

  .edition {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .edition b {
    color: var(--text);
    font-weight: 600;
  }

  /* The lower band: what is happening, and how far along. */
  .foot {
    position: relative;
    padding: 22px 44px 26px;
    border-top: 1px solid var(--line);
    background: rgba(0, 0, 0, 0.25);
  }

  .status {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    min-height: 18px;
  }

  .status .now {
    font-size: 12.5px;
    line-height: 18px;
    color: var(--text);
  }

  .status .count {
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 11px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
  }

  .track {
    margin-top: 12px;
    height: 3px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }

  .track span {
    display: block;
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--brand), var(--brand-lit));
    transition: width 0.45s ease;
  }

  /* The kernel download and anything else that takes minutes. Sits in the
     lower band, in the space the step line would otherwise leave empty. */
  .setup {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    border: 1px solid rgba(194, 19, 34, 0.28);
    border-radius: 12px;
    background: rgba(194, 19, 34, 0.1);
  }

  .setup.on {
    display: block;
  }

  .setup h2 {
    margin: 0;
    font-size: 12.5px;
    font-weight: 600;
  }

  .setup p {
    margin: 3px 0 0;
    font-size: 11px;
    color: var(--muted);
  }

  .setup output {
    display: block;
    height: 48px;
    margin-top: 8px;
    overflow: hidden;
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  /* A failure replaces the whole lower band: nothing below it matters. */
  .fatal {
    display: none;
  }

  body[data-fatal="true"] .status,
  body[data-fatal="true"] .track,
  body[data-fatal="true"] .setup {
    display: none;
  }

  body[data-fatal="true"] .fatal {
    display: flex;
    gap: 16px;
    align-items: center;
    justify-content: space-between;
  }

  .fatal h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--brand-lit);
  }

  .fatal p {
    margin: 4px 0 0;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--muted);
  }

  .fatal button {
    -webkit-app-region: no-drag;
    flex-shrink: 0;
    padding: 7px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }

  .fatal button:hover {
    background: rgba(255, 255, 255, 0.12);
  }
</style>

<div class="frame">
  <div class="stage">
    <img src="./splash-logo.png" alt="" />
    <div>
      <h1>Dermaga</h1>
      <p class="tagline">A harbour for your containers</p>
      <span class="edition"><b id="version">—</b> · Apple Silicon</span>
    </div>
  </div>

  <div class="foot">
    <div class="status">
      <span class="now" id="now">Starting…</span>
      <span class="count" id="count"></span>
    </div>

    <div class="track"><span id="bar"></span></div>

    <section class="setup" id="setup">
      <h2 id="setup-title"></h2>
      <p>This happens once. Leave Dermaga open until it finishes.</p>
      <output id="setup-line"></output>
    </section>

    <div class="fatal">
      <div>
        <h2 id="fatal-title"></h2>
        <p id="fatal-detail"></p>
      </div>
      <button id="quit" type="button">Quit Dermaga</button>
    </div>
  </div>
</div>

<script type="module" src="./splash.js"></script>
