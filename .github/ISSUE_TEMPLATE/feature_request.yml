name: Idea
description: Something Dermaga could do and does not
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: |
        The thing you are trying to get done, rather than the button you think
        would do it. The button is often not the best answer to the problem.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: In Dermaga, in a terminal, or not at all.
